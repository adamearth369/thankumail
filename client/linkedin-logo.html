<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThankuMail LinkedIn Logo Export</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .canvas {
        width: 1024px;
        height: 1024px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 120px 80px;
        text-align: center;
      }

      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.12);
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .brand {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        font-size: 134px;
        line-height: 1;
        letter-spacing: -2px;
        color: #ffffff;
        margin: 0;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      }

      .line1 {
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-size: 48px;
        line-height: 1.2;
        color: #ffffff;
        margin-top: 42px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
      }

      .line2 {
        font-family: "DM Sans", sans-serif;
        font-weight: 400;
        font-size: 48px;
        line-height: 1.2;
        color: #ffffff;
        margin-top: 10px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
      }
    </style>
  </head>

  <body>
    <div class="canvas">
      <img class="bg" src="./hero-background.png" alt="" />
      <div class="overlay"></div>

      <div class="content">
        <h1 class="brand">thankümail</h1>
        <div class="line1">Anonymous Appreciation</div>
        <div class="line2">No Strings Attached</div>
      </div>
    </div>
  </body>
</html>
